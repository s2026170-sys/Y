<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>王道を往くチャット</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* 🟤 野獣リスペクトの男らしい泥臭いカラー（茶色・ベージュ） */
    body {
      background-color: #3e2723;
      color: #d7ccc8;
      font-family: 'Impact', sans-serif, system-ui;
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background-color: #1b0000;
      color: #ffcc00;
      padding: 15px;
      text-align: center;
      font-size: 1.5em;
      font-weight: bold;
      border-bottom: 3px solid #ffcc00;
      text-shadow: 0 0 10px #ffcc00;
    }
    #chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .message {
      padding: 12px 16px;
      border-radius: 5px;
      max-width: 75%;
      font-weight: bold;
      line-height: 1.4;
      word-break: break-word;
    }
    .user {
      background-color: #ffcc00;
      color: #1b0000;
      align-self: flex-end;
    }
    .ai {
      background-color: #5d4037;
      color: #ffffff;
      align-self: flex-start;
      border: 2px dashed #ffcc00;
    }
    #input-area {
      display: flex;
      padding: 15px;
      background-color: #1b0000;
      gap: 10px;
    }
    input {
      flex: 1;
      background: #4e342e;
      border: 2px solid #ffcc00;
      color: #fff;
      padding: 12px;
      outline: none;
      font-size: 16px;
    }
    button {
      background: #ffcc00;
      color: #1b0000;
      border: none;
      padding: 12px 24px;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <header>🎤 空手部・部室（114514） 🎤</header>
  <div id="chat-box"></div>
  <div id="input-area">
    <input type="text" id="user-input" placeholder="先輩に話しかける（いいよ！こいよ！）" onkeydown="handleKeyDown(event)">
    <button id="send-btn" onclick="sendMessage()">送信</button>
  </div>

  <script>
    // 🔗 あなたのCloudflare WorkersのURL
    const CLOUDFLARE_URL = "https://dry-cherry-75df.s2026170.workers.dev/";

    function handleKeyDown(event) {
      if (event.key === 'Enter' && !event.isComposing) {
        sendMessage();
      }
    }

    async function sendMessage() {
      const input = document.getElementById('user-input');
      const btn = document.getElementById('send-btn');
      const text = input.value.trim();
      if (!text) return;

      appendMessage(text, 'user');
      input.value = '';
      input.disabled = true;
      btn.disabled = true;

      try {
        const res = await fetch(CLOUDFLARE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: text })
        });
        
        const data = await res.json();
        
        if (res.ok && data.response) {
          appendMessage(data.response, 'ai');
        } else {
          appendMessage(`ファッ！？データが空っぽだルルォ！？ (${data.error || 'エラー'})`, 'ai');
        }
        
      } catch (err) {
        appendMessage('ファッ！？通信エラーだルルォ！？', 'ai');
      } finally {
        input.disabled = false;
        btn.disabled = false;
        input.focus();
      }
    }

    function appendMessage(text, sender) {
      const box = document.getElementById('chat-box');
      const msg = document.createElement('div');
      msg.classList.add('message', sender);
      msg.innerText = text;
      box.appendChild(msg);
      box.scrollTop = box.scrollHeight;
    }

    // PWA用の設定
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
