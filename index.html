<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #ffffff;
      color: #111111;
      overflow: hidden;
    }

    /* 全画面レイアウト */
    .app-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* ヘッダー */
    .header {
      padding: 16px 24px;
      border-bottom: 1px solid #e0e0e0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* メッセージ一覧 */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 吹き出し（単色デザイン） */
    .message {
      max-width: 80%;
      padding: 12px 16px;
      font-size: 14px;
      line-height: 1.6;
      word-break: break-word;
      white-space: pre-wrap;
      border-radius: 6px;
    }

    /* ユーザー発言：黒背景・白文字 */
    .user-message {
      align-self: flex-end;
      background-color: #111111;
      color: #ffffff;
    }

    /* AI発言：ライトグレー背景・黒文字 */
    .ai-message {
      align-self: flex-start;
      background-color: #f2f2f2;
      color: #111111;
    }

    /* 入力エリア */
    .input-container {
      border-top: 1px solid #e0e0e0;
      padding: 16px 24px;
      display: flex;
      gap: 12px;
      background-color: #ffffff;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #cccccc;
      border-radius: 6px;
      font-size: 15px;
      background-color: #ffffff;
      color: #111111;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #111111;
    }

    /* 送信ボタン（単色） */
    button {
      padding: 0 24px;
      background-color: #111111;
      color: #ffffff;
      border: 1px solid #111111;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.85;
    }

    button:disabled {
      background-color: #cccccc;
      border-color: #cccccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="header">AI Chat</div>
  
  <div class="chat-messages" id="chatMessages">
    <div class="message ai-message">メッセージを入力してください。</div>
  </div>

  <div class="input-container">
    <input type="text" id="userInput" placeholder="メッセージを入力..." autocomplete="off" />
    <button id="sendBtn" onclick="sendMessage()">送信</button>
  </div>
</div>

<script>
  const API_URL = "https://dry-cherry-75df.s2026170.workers.dev/";
  const messagesContainer = document.getElementById("chatMessages");
  const userInput = document.getElementById("userInput");
  const sendBtn = document.getElementById("sendBtn");

  userInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.isComposing) {
      sendMessage();
    }
  });

  function addMessage(text, isUser) {
    const div = document.createElement("div");
    div.className = `message ${isUser ? "user-message" : "ai-message"}`;
    div.textContent = text;
    messagesContainer.appendChild(div);
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    addMessage(text, true);
    userInput.value = "";
    sendBtn.disabled = true;

    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ message: text, prompt: text })
      });

      if (!response.ok) {
        throw new Error(`HTTP Error: ${response.status}`);
      }

      const contentType = response.headers.get("content-type");
      let replyText = "";

      if (contentType && contentType.includes("application/json")) {
        const data = await response.json();
        replyText = data.response || data.reply || data.message || JSON.stringify(data);
      } else {
        replyText = await response.text();
      }

      addMessage(replyText, false);
    } catch (err) {
      addMessage("通信エラー: " + err.message, false);
    } finally {
      sendBtn.disabled = false;
      userInput.focus();
    }
  }
</script>

</body>
</html>
